<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#1f2933" text-anchor="middle">
<title id="t">Who writes what</title>
<desc id="d">Left: what the agent prepares, such as code, tests, commit message drafts, factual fields, and commands that run after confirmation. Right: what the human writes and confirms, such as the sign-off, the PR description, issue text, replies, and the go-ahead for each submission.</desc>
<defs></defs>
<rect width="1100" height="440" fill="#ffffff"/>
<rect x="20" y="16" width="515" height="408" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
<text x="277.5" y="50" font-size="20" fill="#1976d2" font-weight="700">The agent prepares</text>
<rect x="38" y="70" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="56" y="94" font-size="15.5" text-anchor="start" font-weight="700">Code, tests, documentation</text>
<text x="56" y="114" font-size="13" fill="#52606d" text-anchor="start">and you still understand every line</text>
<rect x="38" y="138" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="56" y="162" font-size="15.5" text-anchor="start" font-weight="700">Commit message</text>
<text x="56" y="182" font-size="13" fill="#52606d" text-anchor="start">technical summary and trailers</text>
<rect x="38" y="206" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="56" y="230" font-size="15.5" text-anchor="start" font-weight="700">PR packet</text>
<text x="56" y="250" font-size="13" fill="#52606d" text-anchor="start">factual fields and the AI disclosure</text>
<rect x="38" y="274" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="56" y="298" font-size="15.5" text-anchor="start" font-weight="700">Issue draft</text>
<text x="56" y="318" font-size="13" fill="#52606d" text-anchor="start">environment and verbatim command output</text>
<rect x="38" y="342" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="56" y="366" font-size="15.5" text-anchor="start" font-weight="700">Commands that go public</text>
<text x="56" y="386" font-size="13" fill="#52606d" text-anchor="start">PR, issue, and CI commands, run only after you confirm</text>
<rect x="565" y="16" width="515" height="408" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
<text x="822.5" y="50" font-size="20" fill="#2e7d32" font-weight="700">You write and confirm</text>
<rect x="583" y="70" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="601" y="94" font-size="15.5" text-anchor="start" font-weight="700">The sign-off</text>
<text x="601" y="114" font-size="13" fill="#52606d" text-anchor="start">your identity, your DCO attestation</text>
<rect x="583" y="138" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="601" y="162" font-size="15.5" text-anchor="start" font-weight="700">PR description and rationale</text>
<text x="601" y="182" font-size="13" fill="#52606d" text-anchor="start">the summary is yours to write</text>
<rect x="583" y="206" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="601" y="230" font-size="15.5" text-anchor="start" font-weight="700">Issue description</text>
<text x="601" y="250" font-size="13" fill="#52606d" text-anchor="start">reproduction, expected and actual behavior</text>
<rect x="583" y="274" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="601" y="298" font-size="15.5" text-anchor="start" font-weight="700">Replies to reviewers</text>
<text x="601" y="318" font-size="13" fill="#52606d" text-anchor="start">written by hand and posted by you</text>
<rect x="583" y="342" width="479" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="601" y="366" font-size="15.5" text-anchor="start" font-weight="700">The go-ahead</text>
<text x="601" y="386" font-size="13" fill="#52606d" text-anchor="start">nothing is submitted until you confirm the exact command</text>
</svg>
