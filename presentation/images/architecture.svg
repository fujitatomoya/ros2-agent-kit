<title id="t">Architecture</title>
<desc id="d">Agent harness hooks pass through thin adapters, and git hooks and the GitHub Action call directly, into one check engine named ros2-gate, which reads its rules from JSON policy files. Skills, context files and subagents form the knowledge tier.</desc>
