<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#1f2933" text-anchor="middle">
<title id="t">Gates along a contribution</title>
<desc id="d">Eight steps from session start to reporting results, each with the gate that fires there: G5 informs, G6 advises, the evidence ledger records, G1, G2 and G4 block, G3 asks you to confirm, G7 advises.</desc>
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect width="1100" height="440" fill="#ffffff"/>
<rect x="20" y="30" width="122" height="54" rx="8" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/>
<text x="81" y="61.9" font-size="14" font-weight="700">Start session</text>
<path d="M142,57 L154,57" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#m0)"/>
<line x1="81.0" y1="84" x2="81.0" y2="118" stroke="#1976d2" stroke-width="1.8" stroke-dasharray="3 3"/>
<rect x="20" y="118" width="122" height="196" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.8"/>
<text x="81" y="156" font-size="24" fill="#1976d2" font-weight="700">G5</text>
<rect x="45.0" y="170" width="72" height="24" rx="12" fill="#1976d2"/>
<text x="81" y="187" font-size="12.5" fill="#ffffff" font-weight="700">Inform</text>
<text x="81" y="226" font-size="12.5">Prints the</text>
<text x="81" y="245" font-size="12.5">active profile</text>
<text x="81" y="264" font-size="12.5">and ROS distro</text>
<rect x="154" y="30" width="122" height="54" rx="8" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/>
<text x="215" y="61.9" font-size="14" font-weight="700">Edit code</text>
<path d="M276,57 L288,57" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#m0)"/>
<line x1="215.0" y1="84" x2="215.0" y2="118" stroke="#b26a00" stroke-width="1.8" stroke-dasharray="3 3"/>
<rect x="154" y="118" width="122" height="196" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="1.8"/>
<text x="215" y="156" font-size="24" fill="#b26a00" font-weight="700">G6</text>
<rect x="179.0" y="170" width="72" height="24" rx="12" fill="#b26a00"/>
<text x="215" y="187" font-size="12.5" fill="#ffffff" font-weight="700">Advise</text>
<text x="215" y="226" font-size="12.5">Style check</text>
<text x="215" y="245" font-size="12.5">on each</text>
<text x="215" y="264" font-size="12.5">edited file</text>
<rect x="288" y="30" width="122" height="54" rx="8" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/>
<text x="349" y="61.9" font-size="14" font-weight="700">Build and test</text>
<path d="M410,57 L422,57" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#m0)"/>
<line x1="349.0" y1="84" x2="349.0" y2="118" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray="3 3"/>
<rect x="288" y="118" width="122" height="196" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.8"/>
<text x="349" y="156" font-size="24" fill="#2e7d32" font-weight="700" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">run</text>
<rect x="313.0" y="170" width="72" height="24" rx="12" fill="#2e7d32"/>
<text x="349" y="187" font-size="12.5" fill="#ffffff" font-weight="700">Record</text>
<text x="349" y="226" font-size="12.5">ros2-gate run</text>
<text x="349" y="245" font-size="12.5">logs exit code</text>
<text x="349" y="264" font-size="12.5">and tree hash</text>
<rect x="422" y="30" width="122" height="54" rx="8" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/>
<text x="483" y="61.9" font-size="14" font-weight="700">Commit</text>
<path d="M544,57 L556,57" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#m0)"/>
<line x1="483.0" y1="84" x2="483.0" y2="118" stroke="#c62828" stroke-width="1.8" stroke-dasharray="3 3"/>
<rect x="422" y="118" width="122" height="196" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.8"/>
<text x="483" y="156" font-size="24" fill="#c62828" font-weight="700">G1</text>
<rect x="447.0" y="170" width="72" height="24" rx="12" fill="#c62828"/>
<text x="483" y="187" font-size="12.5" fill="#ffffff" font-weight="700">Block</text>
<text x="483" y="226" font-size="12.5">Human author,</text>
<text x="483" y="245" font-size="12.5">sign-off,</text>
<text x="483" y="264" font-size="12.5">no hook bypass</text>
<rect x="556" y="30" width="122" height="54" rx="8" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/>
<text x="617" y="61.9" font-size="14" font-weight="700">Push</text>
<path d="M678,57 L690,57" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#m0)"/>
<line x1="617.0" y1="84" x2="617.0" y2="118" stroke="#c62828" stroke-width="1.8" stroke-dasharray="3 3"/>
<rect x="556" y="118" width="122" height="196" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.8"/>
<text x="617" y="156" font-size="24" fill="#c62828" font-weight="700">G2</text>
<rect x="581.0" y="170" width="72" height="24" rx="12" fill="#c62828"/>
<text x="617" y="187" font-size="12.5" fill="#ffffff" font-weight="700">Block</text>
<text x="617" y="226" font-size="12.5">Commits pass G1;</text>
<text x="617" y="245" font-size="12.5">build and test</text>
<text x="617" y="264" font-size="12.5">evidence exists</text>
<rect x="690" y="30" width="122" height="54" rx="8" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/>
<text x="751" y="61.9" font-size="14" font-weight="700">Draft PR body</text>
<path d="M812,57 L824,57" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#m0)"/>
<line x1="751.0" y1="84" x2="751.0" y2="118" stroke="#c62828" stroke-width="1.8" stroke-dasharray="3 3"/>
<rect x="690" y="118" width="122" height="196" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.8"/>
<text x="751" y="156" font-size="24" fill="#c62828" font-weight="700">G4</text>
<rect x="715.0" y="170" width="72" height="24" rx="12" fill="#c62828"/>
<text x="751" y="187" font-size="12.5" fill="#ffffff" font-weight="700">Block</text>
<text x="751" y="226" font-size="12.5">Template kept,</text>
<text x="751" y="245" font-size="12.5">AI disclosure</text>
<text x="751" y="264" font-size="12.5">filled in</text>
<rect x="824" y="30" width="122" height="54" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="885" y="54" font-size="14" font-weight="700">Submit PR</text>
<text x="885" y="70.7" font-size="11.5" fill="#52606d">after you confirm</text>
<path d="M946,57 L958,57" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#m0)"/>
<line x1="885.0" y1="84" x2="885.0" y2="118" stroke="#5e35b1" stroke-width="1.8" stroke-dasharray="3 3"/>
<rect x="824" y="118" width="122" height="196" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.8"/>
<text x="885" y="156" font-size="24" fill="#5e35b1" font-weight="700">G3</text>
<rect x="849.0" y="170" width="72" height="24" rx="12" fill="#5e35b1"/>
<text x="885" y="187" font-size="12.5" fill="#ffffff" font-weight="700">Confirm</text>
<text x="885" y="226" font-size="12.5">You approve the</text>
<text x="885" y="245" font-size="12.5">exact command;</text>
<text x="885" y="264" font-size="12.5">no agent replies</text>
<rect x="958" y="30" width="122" height="54" rx="8" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/>
<text x="1019" y="61.9" font-size="14" font-weight="700">Report results</text>
<line x1="1019.0" y1="84" x2="1019.0" y2="118" stroke="#b26a00" stroke-width="1.8" stroke-dasharray="3 3"/>
<rect x="958" y="118" width="122" height="196" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="1.8"/>
<text x="1019" y="156" font-size="24" fill="#b26a00" font-weight="700">G7</text>
<rect x="983.0" y="170" width="72" height="24" rx="12" fill="#b26a00"/>
<text x="1019" y="187" font-size="12.5" fill="#ffffff" font-weight="700">Advise</text>
<text x="1019" y="226" font-size="12.5">Claims such as</text>
<text x="1019" y="245" font-size="12.5">&quot;tests pass&quot;</text>
<text x="1019" y="264" font-size="12.5">need evidence</text>
<rect x="20" y="340" width="72" height="24" rx="12" fill="#c62828"/>
<text x="56" y="357" font-size="12.5" fill="#ffffff" font-weight="700">Block</text>
<text x="104" y="357" font-size="13.5" text-anchor="start">the action is stopped and the agent is told why</text>
<rect x="560" y="340" width="72" height="24" rx="12" fill="#b26a00"/>
<text x="596" y="357" font-size="12.5" fill="#ffffff" font-weight="700">Advise</text>
<text x="644" y="357" font-size="13.5" text-anchor="start">a warning is added to the agent&#x27;s context</text>
<rect x="20" y="374" width="72" height="24" rx="12" fill="#1976d2"/>
<text x="56" y="391" font-size="12.5" fill="#ffffff" font-weight="700">Inform</text>
<text x="104" y="391" font-size="13.5" text-anchor="start">one line of context when the session starts</text>
<rect x="560" y="374" width="72" height="24" rx="12" fill="#2e7d32"/>
<text x="596" y="391" font-size="12.5" fill="#ffffff" font-weight="700">Record</text>
<text x="644" y="391" font-size="13.5" text-anchor="start">not a gate: the ledger entry that G2 and G7 look for</text>
<rect x="20" y="408" width="72" height="24" rx="12" fill="#5e35b1"/>
<text x="56" y="425" font-size="12.5" fill="#ffffff" font-weight="700">Confirm</text>
<text x="104" y="425" font-size="13.5" text-anchor="start">the command runs only after you approve it</text>
<text x="560" y="425" font-size="12.5" fill="#52606d" text-anchor="start" font-style="italic">Shown for the osra-ros2 profile. Other profiles switch some of these off.</text>
</svg>
