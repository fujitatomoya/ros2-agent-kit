name: ros2-gate
description: Run ros2-agent-kit's ros2-gate on the commits of a pull request (tier C enforcement).
inputs:
  profile:
    description: Policy profile id to force (osra-ros2, generic-dco, app). Empty means detect from the remote.
    required: false
    default: ''
  base:
    description: Base commit or ref. Defaults to the pull request base SHA.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: Head commit or ref. Defaults to the pull request head SHA.
    required: false
    default: ${{ github.event.pull_request.head.sha }}
runs:
  using: composite
  steps:
    - name: check commits with ros2-gate
      shell: bash
      run: |
        profile_arg=""
        if [ -n "${{ inputs.profile }}" ]; then profile_arg="--profile ${{ inputs.profile }}"; fi
        python3 "${{ github.action_path }}/../gate/ros2-gate" $profile_arg check-range \
          --base "${{ inputs.base }}" --head "${{ inputs.head }}"
