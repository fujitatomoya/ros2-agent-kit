name: Bug report
description: Something in ros2-agent-kit does not work as designed.
labels: ["bug"]
body:
  - type: input
    id: generative_ai
    attributes:
      label: "Generated by Generative AI"
      description: "If this issue was prepared with a generative tool, specify the tool and model used."
    validations:
      required: false
  - type: input
    id: harness
    attributes:
      label: "Harness and version"
      description: "For example Claude Code 2.1.312, Codex, or Gemini CLI, and the ros2-agent-kit version."
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: "Profile"
      description: "Output of `ros2-gate profile --short` in the affected repository."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce issue"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
    validations:
      required: true
